name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint, and release verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Run tests, lint, and build
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14
